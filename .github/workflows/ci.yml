name: Foundation checks

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6
        env:
          # Ephemeral CI container only; never use trust in deployed environments.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - "127.0.0.1:5432:5432"
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: growthsathi_app_dev
      PGDATABASE: growthsathi_class_dev
      PGTESTDATABASE: growthsathi_class_test
      RUN_DATABASE_TESTS: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: python -m pip install --require-hashes -r backend/requirements-dev.txt
      - name: Generate ephemeral signing key and create restricted CI role
        run: |
          python - <<'PY'
          import os
          import secrets
          import psycopg
          secret = secrets.token_urlsafe(64)
          print(f"::add-mask::{secret}")
          with open(os.environ["GITHUB_ENV"], "a") as target:
              target.write(f"DJANGO_SECRET_KEY={secret}\n")
          with psycopg.connect(host="127.0.0.1", user="postgres", dbname="postgres", autocommit=True) as conn:
              conn.execute("CREATE ROLE growthsathi_app_dev LOGIN NOSUPERUSER NOCREATEROLE CREATEDB NOREPLICATION")
              conn.execute("CREATE DATABASE growthsathi_class_dev OWNER growthsathi_app_dev")
          PY
      - run: python -m pip check
      - run: python -m ruff check backend
      - run: python -m ruff format --check backend
      - run: python backend/manage.py check
      - run: python backend/manage.py test tests --settings=config.settings.test --noinput

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm install --global npm@11.17.0
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
